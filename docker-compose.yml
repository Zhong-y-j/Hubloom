# Hubloom 本地栈：Redis + Qdrant + Postgres + MCP + Serve
# 业务 API / WorldQuantSwagger / 示例 Web 不在此文件；见 ./start.sh
#
# 用法：
#   ./start.sh            # 一键（含构建 Serve / MCP 镜像）
#   docker compose up -d  # 直接起 compose 服务

name: hubloom

services:
  redis:
    image: redis:7-alpine
    container_name: hubloom_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - hubloom_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 12

  qdrant:
    image: qdrant/qdrant:v1.13.2
    container_name: hubloom_qdrant
    restart: unless-stopped
    ports:
      - '6333:6333'
      - '6334:6334'
    environment:
      QDRANT__SERVICE__API_KEY: local-dev
    volumes:
      - hubloom_qdrant_data:/qdrant/storage

  postgres:
    image: postgres:16-alpine
    container_name: hubloom_postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: hubloom
      POSTGRES_PASSWORD: hubloom
      POSTGRES_DB: hubloom
      TZ: Asia/Shanghai
      PGTZ: Asia/Shanghai
    volumes:
      - hubloom_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hubloom -d hubloom']
      interval: 5s
      timeout: 5s
      retries: 12

  mcp:
    build:
      context: .
      dockerfile: src/mcp_adapter/Dockerfile
    image: hubloom_mcp:local
    container_name: hubloom_mcp
    restart: unless-stopped
    ports:
      - '8001:8001'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    environment:
      # start.sh 从 env.yaml 的 mcp.swagger_url 导出；默认指向本机 WorldQuantSwagger
      MCP_SWAGGER_URL: ${MCP_SWAGGER_URL:-http://host.docker.internal:18765/openapi.json}
      MCP_BASE_URL: ${MCP_BASE_URL:-}
      MCP_AUTH_SCHEME: ${MCP_AUTH_SCHEME:-Bearer}
      MCP_HTTP_TIMEOUT: ${MCP_HTTP_TIMEOUT:-900}
      MCP_HTTP_HOST: 0.0.0.0
      MCP_HTTP_PORT: 8001
      MCP_HTTP_PATH: /mcp
      NO_PROXY: localhost,127.0.0.1,host.docker.internal
      no_proxy: localhost,127.0.0.1,host.docker.internal
      HTTP_PROXY: ''
      HTTPS_PROXY: ''
      http_proxy: ''
      https_proxy: ''

  serve:
    build:
      context: .
      dockerfile: Dockerfile
    image: hubloom_serve:local
    container_name: hubloom_serve
    restart: unless-stopped
    ports:
      - '8765:8765'
    depends_on:
      - mcp
    volumes:
      # start.sh 从 env.yaml 生成，把 localhost 改成 host.docker.internal；
      # transport=http 时 mcp.url 再改成 compose 服务名 http://mcp:8001/mcp
      - ./config/env.docker.yaml:/app/config/env.yaml:ro
      - ./data:/app/data
      - ./logs:/app/logs
      - ./skills:/app/skills:ro
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    environment:
      NO_PROXY: localhost,127.0.0.1,host.docker.internal,qdrant,redis,postgres,mcp
      no_proxy: localhost,127.0.0.1,host.docker.internal,qdrant,redis,postgres,mcp
      # 避免容器继承宿主机代理去访问内网依赖
      HTTP_PROXY: ''
      HTTPS_PROXY: ''
      http_proxy: ''
      https_proxy: ''

volumes:
  hubloom_redis_data:
    name: hubloom_redis_data
  hubloom_qdrant_data:
    name: hubloom_qdrant_data
  hubloom_postgres_data:
    name: hubloom_postgres_data
