# Hubloom 本地栈：Redis + Qdrant + Serve
# Postgres / 业务 API(:8000) / 示例 Web(:8080) 不在此文件；见 ./start.sh
#
# 用法：
#   ./start.sh            # 一键（含构建 Serve 镜像）
#   docker compose up -d  # 直接起 compose 服务

name: hubloom

services:
  redis:
    image: redis:7-alpine
    container_name: hubloom_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - hubloom_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 12

  qdrant:
    image: qdrant/qdrant:v1.13.2
    container_name: hubloom_qdrant
    restart: unless-stopped
    ports:
      - '6333:6333'
      - '6334:6334'
    environment:
      QDRANT__SERVICE__API_KEY: local-dev
    volumes:
      - hubloom_qdrant_data:/qdrant/storage

  serve:
    build:
      context: .
      dockerfile: Dockerfile
    image: hubloom-serve:local
    container_name: hubloom_serve
    restart: unless-stopped
    ports:
      - '8765:8765'
    volumes:
      # start.sh 从 env.yaml 生成，把 localhost 改成 host.docker.internal
      - ./config/env.docker.yaml:/app/config/env.yaml:ro
      - ./data:/app/data
      - ./logs:/app/logs
      - ./skills:/app/skills:ro
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    environment:
      NO_PROXY: localhost,127.0.0.1,host.docker.internal,qdrant,redis
      no_proxy: localhost,127.0.0.1,host.docker.internal,qdrant,redis
      # 避免容器继承宿主机代理去访问内网依赖
      HTTP_PROXY: ''
      HTTPS_PROXY: ''
      http_proxy: ''
      https_proxy: ''

volumes:
  hubloom_redis_data:
    name: hubloom_redis_data
  hubloom_qdrant_data:
    name: hubloom_qdrant_data
