# Hubloom 配置模板（可提交仓库）
# 用法：cp config/env.example.yaml config/env.yaml，再填入真实密钥
# 加载：HubloomConfig.from_file("config/env.yaml") → HubloomAgent.create(cfg)
# 占位符 "..." 表示必填时再替换；布尔开关省略时的行为见各段说明

# ---------------------------------------------------------------------------
# Hubloom Serve：产品 HTTP API（python -m server serve）
# CLI --host / --port 可覆盖；省略时默认 0.0.0.0:8765
# ---------------------------------------------------------------------------
http:
  host: 0.0.0.0 # 监听地址
  port: 8765 # 监听端口
  # reload: false # 仅文档占位；本入口不启用热重载

# ---------------------------------------------------------------------------
# Redis：Agent 挂起态 / pending + 按 session 分布式锁（必填，无内存回退）
# ---------------------------------------------------------------------------
redis:
  url: redis://127.0.0.1:6379/0
  # session_ttl_seconds: 604800 # 挂起/pending 键 TTL，默认 7 天
  # lock_ttl_seconds: 1800      # 会话锁 TTL / 等待超时，默认 30 分钟

# ---------------------------------------------------------------------------
# LLM：对话编排 / Embedder（长期记忆与 RAG 入库共用 api_key）
# ---------------------------------------------------------------------------
llm:
  api_key: ... # OpenAI 兼容 API Key（必填）
  # 聊天模型名（必填）。推荐 deepseek-v4-flash：在本项目实测里效果与速度较均衡；
  # 其他 OpenAI 兼容模型亦可，以你的网关实际 model 名为准。
  model: ...
  base_url: ... # API Base，兼容网关；缺省则用 SDK 默认
  timeout: 180 # 请求超时秒数（当前仅配置保留，未全部接到客户端）

# ---------------------------------------------------------------------------
# 记忆
# - 会话历史（SQLite conversation）始终开启，无开关可关
# - enable_long_term 才启用 Qdrant 情景/语义 + Neo4j 图谱
# ---------------------------------------------------------------------------
memory:
  db_path: data/memory.db # 会话历史 SQLite 路径（conversation_store=sqlite 时）
  # conversation_store: sqlite # sqlite | postgres（默认 sqlite）
  # postgres_dsn: postgresql://user:pass@127.0.0.1:5432/hubloom # postgres 时必填
  enable_long_term: false # true=开长期记忆；false/省略=关（不连 qdrant/neo4j）
  consolidate_min_turns: 5 # 离线 worker 提炼：未处理 USER 轮数达到该值才写入长期记忆

# ---------------------------------------------------------------------------
# RAG：文档知识库检索（与长期记忆独立）
# 需 enable=true 且 docs 非空才会入库；仅写 docs、不写 enable 时也会因「有 docs」而开启
# ---------------------------------------------------------------------------
rag:
  enable: false # 是否启用文档 RAG
  kb_dir: data/knowledge_db # Chroma 等本地知识库持久化目录
  docs: '' # 逗号分隔的文件或目录；相对路径相对仓库根

# ---------------------------------------------------------------------------
# 日志：agent_log 为总闸；各通道未写则跟随总闸（总闸 true 时全开）
# ---------------------------------------------------------------------------
logging:
  agent_log: true # 总开关：cortex / a2a / memory / mcp 等结构化日志
  # cortex_log: true # 仅 ADP 编排层；省略则跟随 agent_log
  # a2a_log: true # 仅 A2A；省略则跟随 agent_log
  # memory_log: true # 仅记忆；省略则跟随 agent_log

# ---------------------------------------------------------------------------
# Qdrant：长期记忆向量后端（仅 enable_long_term=true 时使用）
# ---------------------------------------------------------------------------
qdrant:
  url: ... # Qdrant 服务地址
  api_key: ... # Qdrant Cloud / 鉴权 Key
  collection: ... # Collection 名
  no_proxy: 'localhost,127.0.0.1,.qdrant.io,qdrant.io,*.cloud.qdrant.io' # 代理绕过（若走系统代理）

# ---------------------------------------------------------------------------
# Neo4j：长期记忆图谱后端（仅 enable_long_term=true 时使用）
# ---------------------------------------------------------------------------
neo4j:
  uri: neo4j+s://... # bolt:// 或 neo4j+s:// Aura
  user: ... # 用户名
  password: ... # 密码
  database: ... # 库名
  skip_dns_check: true # true=跳过启动前 DNS 探测（常见于代理/Aura）

# ---------------------------------------------------------------------------
# MCP：Swagger → 工具 + 可选多路远端。enable 省略时默认 true
# 业务鉴权请用 session(token=...)，不要在本文件写用户 Token
#
# transport:
#   - stdio（默认）：Runtime / 联调本地拉起 OpenAPI worker（需 swagger_url）
#   - http：连接已部署的 MCP（需 url，如独立容器或线上 MCP）
# remotes：额外 MCP（与主路并存）；工具名带 {id}__ 前缀防冲突
# serve：仅独立 HTTP 服务 / 容器入口参考（python -m mcp_adapter.server.worker --http）
#
# 说明：HubloomRuntime 当前仍只走主路 stdio + swagger_url；
# transport / url / remotes 已由配置解析，供联调脚本与后续 Runtime 接入。
# ---------------------------------------------------------------------------
mcp:
  enable: true # false=不加载 MCP 网关与工具
  transport: stdio # stdio | http
  swagger_url: ... # OpenAPI URL，如 https://petstore.swagger.io/v2/swagger.json（stdio / 独立 serve 必填）
  base_url: ... # 下游 API Base；省略则从 spec 推断
  # url: http://127.0.0.1:8001/mcp # transport=http 时主路 MCP URL
  auth_scheme: Bearer # Authorization 前缀，如 Bearer / JWT
  # 业务鉴权 Token 仅由请求透传（Authorization / X-MCP-Token），勿写在本文件
  # remotes:
  #   - id: search # 逻辑名，list 工具时为 search__toolName
  #     url: https://mcp.example.com/mcp # Streamable HTTP
  #     # headers:
  #     #   Authorization: Bearer ...
  # serve: # 独立部署参考（容器 env 也可用 MCP_SWAGGER_URL 等）
  #   host: 0.0.0.0
  #   port: 8001
  #   path: /mcp

# ---------------------------------------------------------------------------
# A2A：跨 Agent 委托。不配 remote_agents 则 list_agents 为空（功能「关」）
# ---------------------------------------------------------------------------
a2a:
  # public_url: http://127.0.0.1:8001 # 对外公布的本 Agent Card URL（HTTP/A2A 挂载用）
  # remote_agents: # 可委托的远端 Agent 列表
  #   - id: hubloom-self # delegate_task 使用的 id
  #     name: Hubloom # 展示名
  #     url: http://127.0.0.1:8001 # 对端 Base URL（Agent Card）

# ---------------------------------------------------------------------------
# Skills：扫描 skills_dir 下 */SKILL.md，create 时加载并注入 Chat / Thought prompt
# skills_exclude 为目录名黑名单（空 = 不排除）
# ---------------------------------------------------------------------------
skills_dir: skills
skills_exclude: []

# ---------------------------------------------------------------------------
# Agent：默认 Wait Profile（入口可在 HubloomRuntime.run_stream 覆盖）
# interactive=网页可挂起；turn_based=企微等跨轮；no_wait=事件入口禁止等人
# ---------------------------------------------------------------------------
agent:
  default_wait_profile: turn_based

# ---------------------------------------------------------------------------
# Events：业务推送入站（POST /v1/events）。enable=false 时接口返回 503
# 鉴权：请求头 X-Event-Secret 须与 shared_secret 一致（未配置 secret 时跳过校验）
# 支持的 type 真相源：skills/events/*.md（frontmatter event:）；GET /v1/events/types
# catalog 可选：同名覆盖 title/playbook/payload_fields，或追加纯 YAML 类型
# ---------------------------------------------------------------------------
events:
  enable: false
  # shared_secret: change-me
  # result_callback_url: https://biz.example/hooks/hubloom-event-result
  # 业务 Bearer 须由事件体自带 bearer_token，无配置回退
  # catalog:
  #   locker.created:
  #     title: 钥匙柜已登记（覆盖）
  #     payload_fields: [deviceId, cabinetName]

# ---------------------------------------------------------------------------
# IM / 企业微信：自建应用单聊入口（类网页对话）。enable=false 时回调返回 503
# 企微管理后台「接收消息」URL：https://<公网>/v1/im/wecom/callback（HTTPS）
# token_resolve：用企微 UserId 调业务接口换 Bearer（不要填回调 URL）
# 起临时公网隧道 cloudflared tunnel --url http://127.0.0.1:8765，终端出现类似 https://xxxx.trycloudflare.com 的地址
# ---------------------------------------------------------------------------
im:
  wecom:
    enable: false
    # corp_id: ...
    # corp_secret: ...
    # agent_id: 1000002
    # token: ...                 # 企微回调校验 Token（非业务 Bearer）
    # encoding_aes_key: ...      # 43 字符
    # session_prefix: wecom      # session_id = wecom:{UserId}
    # token_resolve:
    #   url: https://biz.example/api/app/account/token-by-wecom
    #   method: POST
    #   body_template: '{"wecomUserId":"{wecom_userid}"}'
    #   token_path: accessToken
    #   # headers:
    #   #   Authorization: "Bearer {service_token}"
    #   # service_token: ...
    #   unbound_http_statuses: [404]
    #   # unbound_codes: ["40001"]
